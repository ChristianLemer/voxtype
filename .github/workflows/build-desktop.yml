name: Build desktop

# Builds voxtype with Parakeet (CoreML on macOS) on Windows, macOS and
# Linux, and keeps the binaries as workflow artifacts.
# Nothing is published: there is no release step.

on:
  push:
    branches:
      - 'desktop'
      - 'feat/desktop'
  workflow_dispatch:

jobs:
  windows:
    # windows-latest ships a Visual Studio the cmake crate used by whisper-rs-sys
    # does not recognise yet; 2022 matches the toolchain this port is built with.
    runs-on: windows-2022
    steps:
      # A git dependency (openvino-rs) has paths past MAX_PATH.
      - name: Allow long paths
        run: git config --system core.longpaths true

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build
        shell: pwsh
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: cargo build --release --features parakeet

      - name: Test the Windows-specific modules
        shell: pwsh
        env:
          CARGO_NET_GIT_FETCH_WITH_CLI: 'true'
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: "cargo test --release --features parakeet --lib -- win:: hotkey_windows sendinput audio::levels setup::start"

      - name: Smoke test
        shell: pwsh
        run: |
          target\release\voxtype.exe --version
          target\release\voxtype.exe info engines

      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-windows-x86_64
          path: |
            target/release/voxtype.exe

  macos:
    runs-on: macos-14  # Apple Silicon
    env:
      # ONNX Runtime that ort 2.0.0-rc.12 binds against; keep in step with
      # scripts/build-macos.sh.
      ORT_VERSION: '1.24.2'
      # Same engine set as the upstream DMG.
      FEATURES: gpu-metal,parakeet-coreml,moonshine,sensevoice,paraformer,dolphin,omnilingual,cohere
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install build tools
        run: brew install cmake

      # Microsoft's prebuilt carries the CoreML execution provider; linked
      # dynamically, as scripts/build-macos.sh does.
      - name: Fetch ONNX Runtime
        run: |
          curl -fL --max-time 300 -o ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-arm64-${ORT_VERSION}.tgz"
          tar -xzf ort.tgz
          echo "ORT_LIB_DIR=$PWD/onnxruntime-osx-arm64-${ORT_VERSION}/lib" >> "$GITHUB_ENV"

      - name: Build
        env:
          ORT_STRATEGY: system
          ORT_PREFER_DYNAMIC_LINK: '1'
        run: ORT_LIB_LOCATION="$ORT_LIB_DIR" cargo build --release --features "$FEATURES"

      # Plain binary, no .app: it looks for the dylib in its own folder.
      # install_name_tool voids the signature, and Apple Silicon kills
      # unsigned code, so it is re-signed ad hoc.
      - name: Stage
        run: |
          mkdir dist
          cp target/release/voxtype dist/
          cp "$ORT_LIB_DIR/libonnxruntime.${ORT_VERSION}.dylib" dist/
          install_name_tool -add_rpath @executable_path dist/voxtype
          codesign --force --sign - dist/voxtype
          otool -L dist/voxtype | grep -i onnx

      - name: Smoke test
        run: |
          dist/voxtype --version
          dist/voxtype info engines

      # Upstream's script assembles Voxtype.app (Swift menubar and setup
      # apps, the binary, ONNX Runtime in Frameworks) and the DMG. The
      # recording card is a subcommand of the binary, so nothing is added.
      - name: Build Voxtype.app and DMG
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p "releases/$VERSION"
          cp target/release/voxtype "releases/$VERSION/voxtype-$VERSION-macos-arm64"
          cp "$ORT_LIB_DIR/libonnxruntime.${ORT_VERSION}.dylib" "releases/$VERSION/"
          VOXTYPE_SKIP_DMG=1 ./scripts/build-macos-dmg.sh "$VERSION"
          # Without a Developer ID, seal the whole bundle ad hoc. The script
          # signs only the binary, then adds Info.plist and the nested apps,
          # which leaves the bundle unsealed: macOS calls it "damaged".
          codesign --force --deep --sign - --preserve-metadata=entitlements "releases/$VERSION/Voxtype.app"
          codesign --verify --deep --strict --verbose=2 "releases/$VERSION/Voxtype.app"
          VOXTYPE_SKIP_APP=1 ./scripts/build-macos-dmg.sh "$VERSION"
          # A zip beside the DMG: a deployment script expands a zip in place,
          # where a DMG needs hdiutil and a mount point. ditto after the
          # sealing above, and with --keepParent, so the bundle and its
          # signature travel intact. The DMG step copies the .app rather than
          # moving it, so it is still here.
          ditto -c -k --keepParent "releases/$VERSION/Voxtype.app" \
            "releases/$VERSION/Voxtype-macos-arm64.app.zip"
          # Checksums over everything a consumer might stage, so it can verify
          # the bytes and not just the file names: a partly-synced copy keeps
          # the right name. The script writes its own DMG-only
          # macos-SHA256SUMS.txt, which stays a local build artifact.
          # Relative names, so `shasum -c SHA256SUMS.txt` works after download.
          ( cd "releases/$VERSION" \
            && shasum -a 256 \
                 *.dmg \
                 Voxtype-macos-arm64.app.zip \
                 "voxtype-$VERSION-macos-arm64" \
                 libonnxruntime.*.dylib \
               > SHA256SUMS.txt )
          cat "releases/$VERSION/SHA256SUMS.txt"
          ls -la "releases/$VERSION"

      # Prove the zip rather than trust it. A bundle can be archived in a way
      # that drops its _CodeSignature resources: the zip looks fine, and only
      # a verify *after* extraction says otherwise. A sibling project shipped
      # exactly that for months, under both ditto and unzip, because nothing
      # checked. Cheap here, and it fails the build instead of a user's Mac.
      - name: Verify the app zip survives a round trip
        run: |
          rm -rf /tmp/zipcheck && mkdir -p /tmp/zipcheck
          ditto -x -k "releases/$VERSION/Voxtype-macos-arm64.app.zip" /tmp/zipcheck
          codesign --verify --deep --strict --verbose=2 /tmp/zipcheck/Voxtype.app
          /tmp/zipcheck/Voxtype.app/Contents/MacOS/voxtype-bin --version
          ( cd "releases/$VERSION" && shasum -a 256 -c SHA256SUMS.txt )
          rm -rf /tmp/zipcheck

      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-macos-aarch64-dmg
          path: |
            releases/${{ env.VERSION }}/*.dmg
            releases/${{ env.VERSION }}/SHA256SUMS.txt

      # Separate from the DMG so a deployment can fetch just the bundle. The
      # checksums ride along in both, keeping each artifact verifiable alone.
      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-macos-aarch64-app-zip
          path: |
            releases/${{ env.VERSION }}/Voxtype-macos-arm64.app.zip
            releases/${{ env.VERSION }}/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-macos-aarch64
          path: dist/

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libclang-dev cmake \
            libgtk-3-dev libglib2.0-dev libx11-dev libxi-dev libxtst-dev

      - name: Build
        run: cargo build --release --features parakeet

      - name: Smoke test
        run: target/release/voxtype --version

      - uses: actions/upload-artifact@v4
        with:
          name: voxtype-linux-x86_64
          path: target/release/voxtype
